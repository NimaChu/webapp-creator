<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root {
      --page: #f3f6f5;
      --surface: #ffffff;
      --soft: #edf3f0;
      --text: #17201c;
      --muted: #617069;
      --line: #d3dcd7;
      --green: #2f7548;
      --green-strong: #245d39;
      --blue: #1e467d;
      --warning: #8a6515;
      font-family: Arial, "Microsoft YaHei UI", sans-serif;
      color: var(--text);
      background: var(--page);
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; }
    button, textarea { font: inherit; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #78a8cf; outline-offset: 2px; }
    .topbar { border-bottom: 1px solid var(--line); background: var(--surface); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; width: min(1280px, calc(100% - 40px)); min-height: 66px; margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .connection { color: var(--muted); font-size: 11px; }
    .shell { width: min(1280px, calc(100% - 40px)); margin: 0 auto; padding: 18px 0 40px; }
    .summary { max-width: 760px; margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .studio { display: grid; grid-template-columns: 390px minmax(0, 1fr); min-height: 590px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .composer { min-width: 0; padding: 18px; border-right: 1px solid var(--line); background: #fafcfb; }
    .modes { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); }
    .mode { flex: 1; min-height: 36px; padding: 0 10px; border: 0; border-radius: 4px; color: var(--muted); background: transparent; font-weight: 700; cursor: pointer; }
    .mode.active { color: var(--blue); background: var(--surface); }
    .form { display: grid; gap: 8px; margin-top: 18px; }
    label { font-size: 12px; font-weight: 700; }
    textarea { width: 100%; min-height: 270px; resize: vertical; padding: 12px; border: 1px solid #afbeb6; border-radius: 6px; color: var(--text); background: var(--surface); line-height: 1.55; }
    .prompt-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 10px; }
    .generate { min-height: 42px; margin-top: 6px; border: 0; border-radius: 6px; color: #ffffff; background: var(--green); font-weight: 700; cursor: pointer; transition: background-color 120ms ease; }
    .generate:hover { background: var(--green-strong); }
    .generate:disabled { cursor: wait; opacity: 0.6; }
    .message { min-height: 18px; margin: 8px 0 0; color: var(--warning); font-size: 11px; line-height: 1.45; }
    .output-pane { display: flex; min-width: 0; flex-direction: column; }
    .output-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .output-actions { display: flex; gap: 8px; }
    .secondary { min-height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--surface); font-weight: 700; cursor: pointer; }
    .secondary:hover { background: var(--soft); }
    .secondary:disabled { cursor: not-allowed; opacity: 0.5; }
    .output { display: grid; flex: 1; min-height: 500px; place-items: center; padding: 24px; background: #f7f9f8; }
    .empty { max-width: 340px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 14px; }
    .text-output { align-self: stretch; justify-self: stretch; margin: 0; padding: 22px; color: #26372e; background: var(--surface); font: 13px/1.75 Arial, "Microsoft YaHei UI", sans-serif; white-space: pre-wrap; word-break: break-word; }
    .image-output { display: grid; width: 100%; height: 100%; place-items: center; }
    .image-output img { display: block; max-width: 100%; max-height: 520px; object-fit: contain; }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .topbar-inner, .shell { width: calc(100% - 24px); }
      .studio { grid-template-columns: 1fr; }
      .composer { border-right: 0; border-bottom: 1px solid var(--line); }
      textarea { min-height: 210px; }
      .output { min-height: 360px; }
    }
    @media (max-width: 420px) {
      .output-head { align-items: flex-start; flex-direction: column; padding-block: 12px; }
      .output-actions { width: 100%; }
      .secondary { flex: 1; }
      .output { min-height: 300px; padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><h1>__TITLE__</h1><span class="connection" id="connection" aria-live="polite">正在连接 Eqai AI Runtime</span></div></header>
  <main class="shell">
    <p class="summary">__SUMMARY__</p>
    <div class="studio">
      <section class="composer" aria-labelledby="composerTitle">
        <h2 id="composerTitle" hidden>生成设置</h2>
        <div class="modes" aria-label="生成类型">
          <button class="mode active" id="textMode" type="button" aria-pressed="true">文本</button>
          <button class="mode" id="imageMode" type="button" aria-pressed="false">图片</button>
        </div>
        <div class="form">
          <label for="promptInput" id="promptLabel">输入任务</label>
          <textarea id="promptInput" placeholder="说明需要分析、整理或生成的内容"></textarea>
          <div class="prompt-meta"><span id="promptHint">写清目标、受众和输出格式</span><span id="charCount">0 个字符</span></div>
          <button class="generate" id="generateButton" type="button" disabled>生成文本</button>
          <p class="message" id="message" aria-live="polite"></p>
        </div>
      </section>
      <section class="output-pane" aria-labelledby="outputTitle">
        <div class="output-head"><h2 id="outputTitle">生成结果</h2><div class="output-actions"><button class="secondary" id="copyButton" type="button" disabled>复制文本</button><button class="secondary" id="downloadButton" type="button" disabled>下载图片</button></div></div>
        <div class="output" id="output" aria-live="polite">
          <div class="empty" id="emptyState"><strong>结果会显示在这里</strong>完成左侧输入后开始生成。生成过程不会保存到平台。</div>
          <pre class="text-output" id="textOutput" hidden></pre>
          <div class="image-output" id="imageOutput" hidden></div>
        </div>
      </section>
    </div>
  </main>
  <script src="/runtime-sdk/v1/eqai.js"></script>
  <script>
    const promptInput = document.querySelector('#promptInput')
    const generateButton = document.querySelector('#generateButton')
    const textMode = document.querySelector('#textMode')
    const imageMode = document.querySelector('#imageMode')
    const textOutput = document.querySelector('#textOutput')
    const imageOutput = document.querySelector('#imageOutput')
    const emptyState = document.querySelector('#emptyState')
    const message = document.querySelector('#message')
    const copyButton = document.querySelector('#copyButton')
    const downloadButton = document.querySelector('#downloadButton')
    let eqai
    let mode = 'text'
    let currentImageUrl
    let profiles = {}

    function setMode(nextMode) {
      mode = nextMode
      textMode.classList.toggle('active', mode === 'text')
      imageMode.classList.toggle('active', mode === 'image')
      textMode.setAttribute('aria-pressed', String(mode === 'text'))
      imageMode.setAttribute('aria-pressed', String(mode === 'image'))
      document.querySelector('#promptLabel').textContent = mode === 'text' ? '输入任务' : '描述图片'
      document.querySelector('#promptHint').textContent = mode === 'text' ? '写清目标、受众和输出格式' : '说明主体、场景、构图和用途'
      promptInput.placeholder = mode === 'text' ? '说明需要分析、整理或生成的内容' : '描述希望生成的图片内容'
      generateButton.textContent = mode === 'text' ? '生成文本' : '生成图片'
      copyButton.hidden = mode !== 'text'
      downloadButton.hidden = mode !== 'image'
      message.textContent = ''
    }

    async function connect() {
      try {
        eqai = await Eqai.connect()
        profiles = eqai.contract?.ai?.profiles ?? {}
        textMode.hidden = !profiles.assistant
        imageMode.hidden = !profiles.illustration
        if (!profiles.assistant && profiles.illustration) setMode('image')
        generateButton.disabled = false
        document.querySelector('#connection').textContent = '已连接'
      } catch (error) {
        document.querySelector('#connection').textContent = '连接失败'
        message.textContent = error.message
      }
    }

    promptInput.addEventListener('input', () => { document.querySelector('#charCount').textContent = `${promptInput.value.length} 个字符` })
    textMode.addEventListener('click', () => setMode('text'))
    imageMode.addEventListener('click', () => setMode('image'))
    generateButton.addEventListener('click', async () => {
      const input = promptInput.value.trim()
      if (!input || !eqai) {
        message.textContent = '请先输入生成内容。'
        promptInput.focus()
        return
      }
      generateButton.disabled = true
      message.textContent = mode === 'text' ? '正在生成文本…' : '正在生成图片…'
      emptyState.hidden = true
      try {
        if (mode === 'text') {
          textOutput.hidden = false
          imageOutput.hidden = true
          textOutput.textContent = ''
          const stream = await eqai.ai.streamText({ profile: 'assistant', input })
          for await (const chunk of stream) textOutput.textContent += chunk
          copyButton.disabled = false
        } else {
          const blob = await eqai.ai.generateImage({ profile: 'illustration', prompt: input, size: '1024x1024', quality: 'auto' })
          if (currentImageUrl) URL.revokeObjectURL(currentImageUrl)
          currentImageUrl = URL.createObjectURL(blob)
          const image = new Image()
          image.alt = input
          image.src = currentImageUrl
          imageOutput.replaceChildren(image)
          imageOutput.hidden = false
          textOutput.hidden = true
          downloadButton.disabled = false
        }
        message.textContent = '生成完成。'
      } catch (error) {
        message.textContent = error.message
      } finally {
        generateButton.disabled = false
      }
    })
    copyButton.addEventListener('click', async () => {
      await navigator.clipboard.writeText(textOutput.textContent)
      message.textContent = '文本已复制。'
    })
    downloadButton.addEventListener('click', () => {
      if (!currentImageUrl) return
      const link = document.createElement('a')
      link.href = currentImageUrl
      link.download = 'eqai-image.png'
      link.click()
    })
    setMode('text')
    void connect()
  </script>
</body>
</html>
