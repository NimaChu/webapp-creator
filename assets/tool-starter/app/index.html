<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f6f5;
      --surface: #ffffff;
      --surface-soft: #edf3f0;
      --text: #17201c;
      --muted: #607069;
      --line: #d2dcd6;
      --line-strong: #aebdb5;
      --green: #2f7548;
      --green-strong: #245d39;
      --blue: #1e467d;
      --warning: #8a6515;
      font-family: Arial, "Microsoft YaHei UI", sans-serif;
      color: var(--text);
      background: var(--page);
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; }
    button, textarea { font: inherit; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #78a8cf; outline-offset: 2px; }
    .appbar { height: 58px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .appbar-inner { display: flex; align-items: center; justify-content: space-between; width: min(1280px, calc(100% - 40px)); height: 100%; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { width: 5px; height: 26px; background: var(--green); }
    h1 { overflow: hidden; margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: 0; text-overflow: ellipsis; white-space: nowrap; }
    .state { color: var(--muted); font-size: 12px; }
    .shell { width: min(1280px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 40px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 16px; }
    .summary { max-width: 760px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .shortcut { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .workspace { display: grid; grid-template-columns: minmax(320px, 0.78fr) minmax(0, 1.22fr); min-height: 560px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .pane { min-width: 0; padding: 20px; }
    .input-pane { border-right: 1px solid var(--line); background: #fbfcfb; }
    .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .step { color: var(--blue); font-size: 11px; font-weight: 700; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    textarea { display: block; width: 100%; min-height: 360px; resize: vertical; padding: 13px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--text); background: var(--surface); line-height: 1.55; }
    .counter { margin-top: 7px; color: var(--muted); font-size: 12px; text-align: right; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button { min-height: 40px; padding: 0 15px; border: 1px solid transparent; border-radius: 6px; color: #ffffff; background: var(--green); font-weight: 700; cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease; }
    button:hover { background: var(--green-strong); }
    button.secondary { border-color: var(--line); color: var(--text); background: var(--surface); }
    button.secondary:hover { border-color: var(--line-strong); background: var(--surface-soft); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .message { min-height: 19px; margin: 10px 0 0; color: var(--warning); font-size: 12px; }
    .result-shell { min-height: 420px; border: 1px dashed var(--line-strong); border-radius: 6px; background: var(--surface-soft); }
    .empty { display: grid; min-height: 420px; place-items: center; padding: 32px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 14px; }
    .result { min-height: 420px; margin: 0; padding: 16px; overflow: auto; color: #21332a; font: 13px/1.65 "Cascadia Code", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .appbar-inner, .shell { width: calc(100% - 24px); }
      .intro { display: block; }
      .shortcut { display: block; margin-top: 8px; }
      .workspace { grid-template-columns: 1fr; }
      .input-pane { border-right: 0; border-bottom: 1px solid var(--line); }
      textarea { min-height: 240px; }
      .result-shell, .empty, .result { min-height: 260px; }
    }
    @media (max-width: 420px) {
      .appbar-inner { width: calc(100% - 20px); }
      .shell { width: calc(100% - 20px); padding-top: 18px; }
      .pane { padding: 15px; }
      .actions button { flex: 1 1 120px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>__TITLE__</h1></div>
      <span class="state" id="state" aria-live="polite">等待输入</span>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <p class="summary">__SUMMARY__</p>
      <span class="shortcut">Ctrl + Enter 执行</span>
    </div>
    <div class="workspace">
      <section class="pane input-pane" aria-labelledby="inputTitle">
        <div class="pane-head"><h2 id="inputTitle">输入</h2><span class="step">步骤 1</span></div>
        <label for="sourceInput">待处理内容</label>
        <textarea id="sourceInput" placeholder="粘贴或输入需要处理的内容，每行作为一项"></textarea>
        <div class="counter" id="counter">0 个字符</div>
        <div class="actions">
          <button id="runButton" type="button">生成结果</button>
          <button id="clearButton" class="secondary" type="button">清空</button>
        </div>
        <p class="message" id="message" aria-live="polite"></p>
      </section>
      <section class="pane" aria-labelledby="outputTitle">
        <div class="pane-head">
          <h2 id="outputTitle">结果</h2>
          <button id="copyButton" class="secondary" type="button" disabled>复制结果</button>
        </div>
        <div class="result-shell">
          <div class="empty" id="emptyState"><div><strong>结果会显示在这里</strong>完成左侧输入后即可生成、检查并复制。</div></div>
          <pre class="result" id="result" hidden aria-live="polite"></pre>
        </div>
      </section>
    </div>
  </main>
  <script>
    const input = document.querySelector('#sourceInput')
    const result = document.querySelector('#result')
    const emptyState = document.querySelector('#emptyState')
    const message = document.querySelector('#message')
    const state = document.querySelector('#state')
    const counter = document.querySelector('#counter')
    const copyButton = document.querySelector('#copyButton')

    function processValue(value) {
      return value.split(/\r?\n/).map(line => line.trim()).filter(Boolean).map((line, index) => `${index + 1}. ${line}`).join('\n')
    }

    function run() {
      const value = input.value.trim()
      if (!value) {
        message.textContent = '请先输入需要处理的内容。'
        input.focus()
        return
      }
      const output = processValue(value)
      result.textContent = output
      result.hidden = false
      emptyState.hidden = true
      copyButton.disabled = false
      message.textContent = ''
      state.textContent = `已生成 ${output.split('\n').length} 项`
    }

    input.addEventListener('input', () => { counter.textContent = `${input.value.length} 个字符` })
    input.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') run()
    })
    document.querySelector('#runButton').addEventListener('click', run)
    document.querySelector('#clearButton').addEventListener('click', () => {
      input.value = ''
      result.textContent = ''
      result.hidden = true
      emptyState.hidden = false
      copyButton.disabled = true
      message.textContent = ''
      counter.textContent = '0 个字符'
      state.textContent = '等待输入'
      input.focus()
    })
    copyButton.addEventListener('click', async () => {
      await navigator.clipboard.writeText(result.textContent)
      state.textContent = '结果已复制'
    })
  </script>
</body>
</html>
