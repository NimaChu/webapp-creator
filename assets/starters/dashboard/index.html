<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23165d82'/%3E%3C/svg%3E">
  <title>__TITLE__</title>
  <style>
    :root {
      --bg: #f4f6f8; --surface: #fff; --text: #17212b; --muted: #687583;
      --line: #d8dee5; --accent: #165d82; --good: #14775e; --warn: #ad6418;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 48px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.2rem); }
    .summary { margin: 7px 0 0; color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 0.82rem; font-weight: 700; }
    select, button { min-height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: inherit; font: inherit; }
    select { padding: 0 34px 0 10px; }
    button { padding: 0 14px; cursor: pointer; font-weight: 700; }
    button:focus-visible, select:focus-visible { outline: 3px solid rgba(11, 111, 211, 0.28); outline-offset: 2px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--surface); }
    .metric { padding: 18px; }
    .metric + .metric { border-left: 1px solid var(--line); }
    .metric span { display: block; color: var(--muted); font-size: 0.82rem; font-weight: 700; }
    .metric strong { display: block; margin-top: 8px; font-size: clamp(1.45rem, 3vw, 2rem); }
    .metric small { display: block; margin-top: 5px; color: var(--good); }
    .content { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 0.7fr); gap: 16px; margin-top: 16px; }
    .panel { border: 1px solid var(--line); background: var(--surface); }
    .panel h2 { margin: 0; padding: 16px 18px; border-bottom: 1px solid var(--line); font-size: 1rem; }
    .chart { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 10px; height: 280px; padding: 28px 20px 34px; }
    .bar { position: relative; min-height: 8px; background: var(--accent); }
    .bar span { position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); color: var(--muted); font-size: 0.75rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-size: 0.78rem; }
    .flag { color: var(--warn); font-weight: 700; }
    .empty { padding: 30px; color: var(--muted); text-align: center; }
    @media (max-width: 820px) {
      main { width: min(100% - 20px, 680px); }
      header { align-items: start; flex-direction: column; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .metric:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
      .metric:nth-child(4) { border-top: 1px solid var(--line); }
      .content { grid-template-columns: 1fr; }
    }
    @media (max-width: 430px) {
      .metrics { grid-template-columns: 1fr; }
      .metric + .metric { border-left: 0; border-top: 1px solid var(--line); }
      .chart { gap: 5px; padding-inline: 12px; }
    }
  </style>
</head>
<body data-webapp-kind="__KIND__" data-ai-capabilities="__AI_CAPABILITIES__">
  <main>
    <header>
      <div>
        <h1>__TITLE__</h1>
        <p class="summary">__SUMMARY__</p>
      </div>
      <div class="filters">
        <label for="period">时间范围
          <select id="period">
            <option value="7">最近 7 天</option>
            <option value="30">最近 30 天</option>
          </select>
        </label>
        <button id="resetButton" type="button">重置筛选</button>
      </div>
    </header>
    <section class="metrics" aria-label="核心指标">
      <div class="metric"><span>总量</span><strong id="total">1,284</strong><small>较上期 +8.4%</small></div>
      <div class="metric"><span>完成率</span><strong>86%</strong><small>较上期 +3.1%</small></div>
      <div class="metric"><span>平均耗时</span><strong>4.2m</strong><small>较上期 -0.6m</small></div>
      <div class="metric"><span>待处理</span><strong>17</strong><small>需要关注</small></div>
    </section>
    <section class="content">
      <article class="panel">
        <h2>每日趋势</h2>
        <div class="chart" id="chart" aria-label="最近七天趋势图"></div>
      </article>
      <article class="panel">
        <h2>异常项</h2>
        <table>
          <thead><tr><th>项目</th><th>状态</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty" id="empty" hidden>当前筛选下没有异常。</p>
      </article>
    </section>
  </main>
  <script>
    const sevenDays = [58, 72, 64, 81, 76, 92, 86];
    const thirtyDays = [61, 66, 70, 73, 78, 80, 84];
    const issues = [
      ['数据导入', '延迟 12 分钟'],
      ['复核队列', '剩余 9 项'],
      ['导出任务', '失败 2 次']
    ];

    function render(days) {
      const values = days === '7' ? sevenDays : thirtyDays;
      const chart = document.querySelector('#chart');
      chart.replaceChildren(...values.map((value, index) => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${value}%`;
        bar.title = `第 ${index + 1} 天：${value}`;
        const label = document.createElement('span');
        label.textContent = `D${index + 1}`;
        bar.append(label);
        return bar;
      }));
      const rows = document.querySelector('#rows');
      rows.replaceChildren(...issues.map(([name, state]) => {
        const row = document.createElement('tr');
        const nameCell = document.createElement('td');
        const stateCell = document.createElement('td');
        nameCell.textContent = name;
        stateCell.textContent = state;
        stateCell.className = 'flag';
        row.append(nameCell, stateCell);
        return row;
      }));
      document.querySelector('#total').textContent = days === '7' ? '1,284' : '4,962';
    }

    document.querySelector('#period').addEventListener('change', event => render(event.target.value));
    document.querySelector('#resetButton').addEventListener('click', () => {
      document.querySelector('#period').value = '7';
      render('7');
    });
    render('7');
  </script>
</body>
</html>
