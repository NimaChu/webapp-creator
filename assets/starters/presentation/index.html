<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%231d6552'/%3E%3C/svg%3E">
  <title>__TITLE__</title>
  <style>
    :root {
      --stage-width: 1600;
      --stage-height: 900;
      --stage-scale: 1;
      --bg: __BRAND_BACKGROUND__;
      --surface: __BRAND_SURFACE__;
      --ink: __BRAND_TEXT__;
      --muted: __BRAND_MUTED__;
      --accent: __BRAND_PRIMARY__;
      --secondary: __BRAND_SECONDARY__;
      --line: __BRAND_LINE__;
      --display-font: __BRAND_DISPLAY_FONT__;
      --body-font: __BRAND_BODY_FONT__;
      --data-font: __BRAND_DATA_FONT__;
      font-family: var(--body-font);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
    button { font: inherit; }
    .deck-viewport { position: fixed; inset: 0; overflow: hidden; }
    .deck-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--stage-width) * 1px);
      height: calc(var(--stage-height) * 1px);
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(18, 26, 22, 0.18);
    }
    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: center;
      padding: 96px 110px 126px;
      overflow: hidden;
      background: var(--surface);
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .slide.active { visibility: visible; opacity: 1; pointer-events: auto; }
    .brand-lockup {
      position: absolute;
      top: 48px;
      right: 60px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font: 700 15px/1 var(--data-font);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .brand-logo { display: block; width: auto; max-width: 160px; height: 34px; object-fit: contain; }
    .eyebrow { margin: 0 0 18px; color: var(--accent); font: 800 18px/1.2 var(--data-font); letter-spacing: 0.08em; text-transform: uppercase; }
    h1, h2 { max-width: 13ch; margin: 0; font-family: var(--display-font); font-weight: 700; line-height: 0.98; text-wrap: balance; }
    h1 { font-size: 108px; }
    h2 { font-size: 76px; }
    .lead { max-width: 58ch; margin: 30px 0 0; color: var(--muted); font-size: 25px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 48px; }
    .item { min-height: 190px; padding: 28px; border-top: 6px solid var(--accent); background: color-mix(in srgb, var(--secondary) 45%, var(--surface)); }
    .item strong { display: block; font-size: 26px; }
    .item p { margin: 14px 0 0; color: var(--muted); font-size: 20px; line-height: 1.5; }
    .quote { max-width: 20ch; margin: 0; font: 600 72px/1.12 var(--display-font); text-wrap: balance; }
    .slide-index { position: absolute; left: 110px; bottom: 54px; color: var(--muted); font: 700 15px/1 var(--data-font); }
    .progress { position: fixed; inset: 0 0 auto; z-index: 10; height: 4px; background: transparent; }
    .progress span { display: block; width: 0; height: 100%; background: var(--accent); transition: width 180ms ease; }
    .controls {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(10px);
    }
    .controls button { min-width: 42px; min-height: 42px; border: 1px solid var(--line); background: var(--surface); color: inherit; font-weight: 800; cursor: pointer; }
    .controls button:disabled { cursor: default; opacity: 0.38; }
    .controls button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px; }
    #count { min-width: 68px; color: var(--muted); text-align: center; font: 700 13px/1 var(--data-font); }
    __BRAND_CSS__
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
    @page { size: 13.333in 7.5in; margin: 0; }
    @media print {
      html, body { width: auto; height: auto; overflow: visible; background: #fff; }
      .deck-viewport { position: static; overflow: visible; }
      .deck-stage { position: static; width: 13.333in; height: auto; transform: none !important; box-shadow: none; }
      .slide, .slide.active { position: relative; display: grid; width: 13.333in; height: 7.5in; visibility: visible; opacity: 1; break-after: page; page-break-after: always; }
      .controls, .progress { display: none; }
    }
  </style>
</head>
<body
  data-webapp-kind="__KIND__"
  data-ai-capabilities="__AI_CAPABILITIES__"
  data-stage-mode="fixed"
  data-visual-system="__VISUAL_SYSTEM__"
  data-density="balanced"
  data-brand="__BRAND_NAME__"
  data-brand-layouts="__BRAND_LAYOUTS__"
>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <div class="deck-viewport">
    <main class="deck-stage" aria-live="off">
      <section class="slide active" data-slide-id="opening" data-layout="cover" data-title="__TITLE__">
        <div class="brand-lockup">__BRAND_LOGO_MARKUP__<span>__BRAND_NAME__</span></div>
        <p class="eyebrow">主题概览</p>
        <h1>__TITLE__</h1>
        <p class="lead">__SUMMARY__</p>
        <span class="slide-index">01</span>
      </section>
      <section class="slide" data-slide-id="evidence" data-layout="evidence" data-title="关键结构">
        <div class="brand-lockup">__BRAND_LOGO_MARKUP__<span>__BRAND_NAME__</span></div>
        <p class="eyebrow">关键结构</p>
        <h2>让内容围绕决策展开</h2>
        <div class="grid">
          <article class="item"><strong>现状</strong><p>用具体事实建立共同背景。</p></article>
          <article class="item"><strong>判断</strong><p>解释为什么现在需要行动。</p></article>
          <article class="item"><strong>下一步</strong><p>给出负责人、动作和完成信号。</p></article>
        </div>
        <span class="slide-index">02</span>
      </section>
      <section class="slide" data-slide-id="decision" data-layout="closing" data-title="结论">
        <div class="brand-lockup">__BRAND_LOGO_MARKUP__<span>__BRAND_NAME__</span></div>
        <p class="eyebrow">结论</p>
        <h2 class="quote">把最重要的一句话留在最后一屏。</h2>
        <p class="lead">方向键、Page Up/Down、滚轮或滑动均可翻页；打印时每页输出一张 16:9 幻灯片。</p>
        <span class="slide-index">03</span>
      </section>
    </main>
  </div>
  <nav class="controls" aria-label="演示控制">
    <button id="previousButton" type="button" aria-label="上一页">←</button>
    <span id="count" aria-live="polite">1 / 3</span>
    <button id="nextButton" type="button" aria-label="下一页">→</button>
    <button id="fullscreenButton" type="button" aria-label="切换全屏">⛶</button>
  </nav>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const count = document.querySelector('#count');
    const progressBar = document.querySelector('#progressBar');
    const previousButton = document.querySelector('#previousButton');
    const nextButton = document.querySelector('#nextButton');
    const fullscreenButton = document.querySelector('#fullscreenButton');
    const root = document.documentElement;
    let index = 0;
    let wheelLocked = false;
    let pointerStart = null;

    function resizeStage() {
      const margin = 28;
      const scale = Math.min((innerWidth - margin) / 1600, (innerHeight - margin) / 900);
      root.style.setProperty('--stage-scale', String(Math.max(0.1, scale)));
    }

    function indexFromHash() {
      const id = decodeURIComponent(location.hash.replace(/^#slide-/, ''));
      const found = slides.findIndex(slide => slide.dataset.slideId === id);
      return found >= 0 ? found : 0;
    }

    function show(next, updateHash = true) {
      index = Math.max(0, Math.min(slides.length - 1, next));
      slides.forEach((slide, slideIndex) => {
        const active = slideIndex === index;
        slide.classList.toggle('active', active);
        slide.setAttribute('aria-hidden', String(!active));
        slide.toggleAttribute('inert', !active);
      });
      previousButton.disabled = index === 0;
      nextButton.disabled = index === slides.length - 1;
      count.textContent = `${index + 1} / ${slides.length}`;
      progressBar.style.width = `${((index + 1) / slides.length) * 100}%`;
      document.title = `${slides[index].dataset.title || '__TITLE__'} · __TITLE__`;
      if (updateHash) history.replaceState(null, '', `#slide-${slides[index].dataset.slideId}`);
    }

    previousButton.addEventListener('click', () => show(index - 1));
    nextButton.addEventListener('click', () => show(index + 1));
    fullscreenButton.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        fullscreenButton.title = '当前环境不允许全屏';
      }
    });
    window.addEventListener('keydown', event => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
        show(index + 1);
      }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) {
        event.preventDefault();
        show(index - 1);
      }
      if (event.key === 'Home') show(0);
      if (event.key === 'End') show(slides.length - 1);
      if (event.key.toLowerCase() === 'f') fullscreenButton.click();
    });
    window.addEventListener('wheel', event => {
      if (wheelLocked || Math.abs(event.deltaY) < 24 || event.target.closest('input, textarea, select, [data-scrollable]')) return;
      wheelLocked = true;
      show(index + Math.sign(event.deltaY));
      window.setTimeout(() => { wheelLocked = false; }, 420);
    }, { passive: true });
    window.addEventListener('pointerdown', event => {
      pointerStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
    });
    window.addEventListener('pointerup', event => {
      if (!pointerStart || pointerStart.id !== event.pointerId) return;
      const dx = event.clientX - pointerStart.x;
      const dy = event.clientY - pointerStart.y;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) show(index + (dx < 0 ? 1 : -1));
      pointerStart = null;
    });
    window.addEventListener('hashchange', () => show(indexFromHash(), false));
    window.addEventListener('resize', resizeStage);
    resizeStage();
    show(indexFromHash(), false);
  </script>
</body>
</html>
