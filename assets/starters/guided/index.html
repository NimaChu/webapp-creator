<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232e6854'/%3E%3C/svg%3E">
  <title>__TITLE__</title>
  <style>
    :root {
      --bg: #f5f4f0; --surface: #fff; --text: #202621; --muted: #697169;
      --line: #d9dcd5; --accent: #2e6854; --soft: #edf4ef;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
    h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.25rem); }
    .summary { margin: 8px 0 20px; color: var(--muted); }
    .progress { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 14px; border: 1px solid var(--line); background: var(--surface); }
    .step-label { padding: 12px; color: var(--muted); text-align: center; font-size: 0.85rem; font-weight: 700; }
    .step-label.active { background: var(--soft); color: var(--accent); }
    .card { border: 1px solid var(--line); background: var(--surface); }
    .step { display: none; padding: clamp(20px, 4vw, 34px); }
    .step.active { display: block; }
    h2 { margin: 0 0 8px; font-size: 1.25rem; }
    .hint { margin: 0 0 22px; color: var(--muted); }
    .field { display: grid; gap: 7px; margin: 0 0 18px; }
    label, legend { font-weight: 750; }
    input, select, textarea {
      width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 6px; background: #fbfcfa; color: inherit; font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    fieldset { margin: 0 0 18px; padding: 0; border: 0; }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 9px; }
    .choice { display: flex; gap: 8px; align-items: center; padding: 11px; border: 1px solid var(--line); border-radius: 6px; }
    .choice input { width: auto; min-height: 0; }
    .actions { display: flex; justify-content: space-between; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--line); }
    button { min-height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: inherit; font: inherit; font-weight: 750; cursor: pointer; }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(29, 112, 185, 0.28); outline-offset: 2px; }
    .review { display: grid; gap: 12px; margin: 20px 0; }
    .review-row { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .review-row dt { color: var(--muted); }
    .review-row dd { margin: 0; white-space: pre-wrap; }
    .status { min-height: 24px; margin: 14px 0 0; color: var(--accent); font-weight: 700; }
    @media (max-width: 600px) {
      main { width: min(100% - 20px, 560px); padding-top: 18px; }
      .step-label { padding-inline: 5px; font-size: 0.76rem; }
      .choices { grid-template-columns: 1fr; }
      .review-row { grid-template-columns: 1fr; gap: 4px; }
      .actions { padding: 12px; }
    }
  </style>
</head>
<body data-webapp-kind="__KIND__" data-ai-capabilities="__AI_CAPABILITIES__">
  <main>
    <h1>__TITLE__</h1>
    <p class="summary">__SUMMARY__</p>
    <nav class="progress" aria-label="流程进度">
      <span class="step-label active">1. 基本信息</span>
      <span class="step-label">2. 详细设置</span>
      <span class="step-label">3. 确认</span>
    </nav>
    <form class="card" id="wizard">
      <section class="step active" data-step="0">
        <h2>基本信息</h2>
        <p class="hint">先填写完成任务所需的最少信息。</p>
        <div class="field">
          <label for="name">名称</label>
          <input id="name" required maxlength="80" autocomplete="off">
        </div>
        <div class="field">
          <label for="purpose">目标</label>
          <textarea id="purpose" required maxlength="600"></textarea>
        </div>
      </section>
      <section class="step" data-step="1">
        <h2>详细设置</h2>
        <p class="hint">选择最符合实际使用环境的选项。</p>
        <fieldset>
          <legend>优先级</legend>
          <div class="choices">
            <label class="choice"><input name="priority" type="radio" value="低" aria-label="低优先级" checked>低</label>
            <label class="choice"><input name="priority" type="radio" value="中" aria-label="中优先级">中</label>
            <label class="choice"><input name="priority" type="radio" value="高" aria-label="高优先级">高</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="owner">负责人</label>
          <input id="owner" maxlength="80" autocomplete="off">
        </div>
      </section>
      <section class="step" data-step="2">
        <h2>确认信息</h2>
        <p class="hint">检查后生成一份可以复制的摘要。</p>
        <dl class="review" id="review"></dl>
        <button id="copyButton" type="button">复制摘要</button>
        <p class="status" id="status" aria-live="polite"></p>
      </section>
      <div class="actions">
        <button id="backButton" type="button" disabled>上一步</button>
        <button class="primary" id="nextButton" type="button">下一步</button>
      </div>
    </form>
  </main>
  <script>
    const steps = [...document.querySelectorAll('.step')];
    const labels = [...document.querySelectorAll('.step-label')];
    const backButton = document.querySelector('#backButton');
    const nextButton = document.querySelector('#nextButton');
    let current = 0;

    function values() {
      return {
        名称: document.querySelector('#name').value.trim(),
        目标: document.querySelector('#purpose').value.trim(),
        优先级: document.querySelector('[name="priority"]:checked').value,
        负责人: document.querySelector('#owner').value.trim() || '未指定'
      };
    }

    function show(index) {
      current = index;
      steps.forEach((step, i) => step.classList.toggle('active', i === index));
      labels.forEach((label, i) => label.classList.toggle('active', i === index));
      backButton.disabled = index === 0;
      nextButton.hidden = index === steps.length - 1;
      if (index === steps.length - 1) renderReview();
      steps[index].querySelector('input, textarea, button')?.focus();
    }

    function renderReview() {
      const review = document.querySelector('#review');
      review.replaceChildren(...Object.entries(values()).map(([key, value]) => {
        const row = document.createElement('div');
        row.className = 'review-row';
        const term = document.createElement('dt');
        const description = document.createElement('dd');
        term.textContent = key;
        description.textContent = value;
        row.append(term, description);
        return row;
      }));
    }

    nextButton.addEventListener('click', () => {
      const required = [...steps[current].querySelectorAll('[required]')];
      const invalid = required.find(control => !control.reportValidity());
      if (!invalid) show(Math.min(current + 1, steps.length - 1));
    });
    backButton.addEventListener('click', () => show(Math.max(current - 1, 0)));
    document.querySelector('#copyButton').addEventListener('click', async () => {
      const text = Object.entries(values()).map(([key, value]) => `${key}：${value}`).join('\n');
      await navigator.clipboard.writeText(text);
      document.querySelector('#status').textContent = '摘要已复制。';
    });
  </script>
</body>
</html>
