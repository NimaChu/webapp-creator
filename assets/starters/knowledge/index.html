<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2342624b'/%3E%3C/svg%3E">
  <title>__TITLE__</title>
  <style>
    :root {
      --paper: #fbfaf6; --surface: #fff; --text: #242721; --muted: #6e736a;
      --line: #dedfd8; --accent: #42624b; --mark: #fff0a8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--text); }
    main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    header { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 0.55fr); align-items: end; gap: 30px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 600; }
    .summary { max-width: 58ch; margin: 8px 0 0; color: var(--muted); line-height: 1.6; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 0.82rem; font-weight: 700; }
    input { min-height: 44px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: inherit; font: inherit; }
    input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid rgba(44, 112, 158, 0.3); outline-offset: 2px; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 34px; margin-top: 28px; }
    aside { position: sticky; top: 20px; align-self: start; }
    aside h2 { margin: 0 0 10px; font-size: 0.86rem; text-transform: uppercase; }
    .topic { display: block; width: 100%; min-height: 40px; padding: 8px 10px; border: 0; border-left: 3px solid transparent; background: transparent; color: var(--muted); text-align: left; font: inherit; cursor: pointer; }
    .topic.active { border-left-color: var(--accent); color: var(--text); font-weight: 750; }
    .entries { display: grid; gap: 12px; }
    details { border-bottom: 1px solid var(--line); background: var(--surface); }
    summary { display: flex; justify-content: space-between; gap: 16px; padding: 18px; cursor: pointer; font-weight: 750; }
    summary::after { content: "+"; color: var(--accent); }
    details[open] summary::after { content: "−"; }
    .answer { padding: 0 18px 20px; color: #454b43; line-height: 1.7; }
    .answer p { margin: 0; }
    .tag { color: var(--muted); font-size: 0.76rem; font-weight: 600; }
    mark { background: var(--mark); color: inherit; }
    .empty { padding: 38px 0; color: var(--muted); }
    @media (max-width: 700px) {
      main { width: min(100% - 20px, 650px); padding-top: 18px; }
      header { grid-template-columns: 1fr; gap: 18px; }
      .layout { grid-template-columns: 1fr; gap: 18px; }
      aside { position: static; overflow-x: auto; white-space: nowrap; }
      .topic { display: inline-block; width: auto; border-left: 0; border-bottom: 3px solid transparent; }
      .topic.active { border-bottom-color: var(--accent); }
    }
  </style>
</head>
<body data-webapp-kind="__KIND__" data-ai-capabilities="__AI_CAPABILITIES__">
  <main>
    <header>
      <div>
        <h1>__TITLE__</h1>
        <p class="summary">__SUMMARY__</p>
      </div>
      <label for="search">搜索内容
        <input id="search" type="search" placeholder="输入关键词">
      </label>
    </header>
    <div class="layout">
      <aside aria-label="主题筛选">
        <h2>主题</h2>
        <button class="topic active" type="button" data-topic="全部">全部</button>
        <button class="topic" type="button" data-topic="开始">开始</button>
        <button class="topic" type="button" data-topic="流程">流程</button>
        <button class="topic" type="button" data-topic="排错">排错</button>
      </aside>
      <section>
        <h2>常见问题</h2>
        <div class="entries" id="entries"></div>
        <p class="empty" id="empty" hidden>没有找到匹配的内容。</p>
      </section>
    </div>
  </main>
  <script>
    const data = [
      { topic: '开始', title: '从哪里开始？', body: '先明确要完成的核心任务、输入和期望输出，再处理次要设置。' },
      { topic: '流程', title: '如何保存当前内容？', body: '使用页面提供的下载或导出操作，将结果保存为本地文件。' },
      { topic: '流程', title: '如何恢复上次状态？', body: '本地应用可以使用浏览器存储保存非敏感设置和进度。' },
      { topic: '排错', title: '页面没有响应怎么办？', body: '刷新页面并重新执行；如果输入较大，先用较小样本确认流程正常。' }
    ];
    let activeTopic = '全部';

    function render() {
      const query = document.querySelector('#search').value.trim().toLowerCase();
      const matched = data.filter(item => {
        const inTopic = activeTopic === '全部' || item.topic === activeTopic;
        const inText = `${item.title} ${item.body}`.toLowerCase().includes(query);
        return inTopic && inText;
      });
      const entries = document.querySelector('#entries');
      entries.replaceChildren(...matched.map(item => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const title = document.createElement('span');
        const tag = document.createElement('span');
        const answer = document.createElement('div');
        const paragraph = document.createElement('p');
        title.textContent = item.title;
        tag.textContent = item.topic;
        tag.className = 'tag';
        summary.append(title, tag);
        paragraph.textContent = item.body;
        answer.className = 'answer';
        answer.append(paragraph);
        details.append(summary, answer);
        return details;
      }));
      document.querySelector('#empty').hidden = matched.length > 0;
    }

    document.querySelector('#search').addEventListener('input', render);
    document.querySelectorAll('.topic').forEach(button => {
      button.addEventListener('click', () => {
        activeTopic = button.dataset.topic;
        document.querySelectorAll('.topic').forEach(item => item.classList.toggle('active', item === button));
        render();
      });
    });
    render();
  </script>
</body>
</html>
