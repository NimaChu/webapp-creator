<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23176b5b'/%3E%3C/svg%3E">
  <title>__TITLE__</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f7;
      --surface: #ffffff;
      --text: #17212b;
      --muted: #617080;
      --line: #d7dee5;
      --accent: #176b5b;
      --accent-hover: #105447;
      --focus: #0b6fd3;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.2rem); line-height: 1.1; }
    .summary { max-width: 54ch; margin: 8px 0 0; color: var(--muted); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .panel { min-width: 0; padding: 20px; }
    .panel + .panel { border-left: 1px solid var(--line); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 1rem; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    textarea {
      display: block; width: 100%; min-height: 340px; resize: vertical; padding: 14px;
      border: 1px solid var(--line); border-radius: 6px; background: #fbfcfd; color: inherit;
      font: 0.95rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .output { min-height: 340px; margin: 0; padding: 14px; overflow-wrap: anywhere; white-space: pre-wrap; border: 1px solid var(--line); border-radius: 6px; background: #f8faf9; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface); color: inherit; font: inherit; font-weight: 700; cursor: pointer;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button:hover { border-color: #9aa8b6; }
    button.primary:hover { background: var(--accent-hover); }
    button:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent); outline-offset: 2px; }
    .status { min-height: 24px; margin: 12px 0 0; color: var(--muted); font-size: 0.9rem; }
    @media (max-width: 760px) {
      main { width: min(100% - 20px, 680px); padding-top: 18px; }
      header { align-items: start; flex-direction: column; }
      .workspace { grid-template-columns: 1fr; }
      .panel + .panel { border-left: 0; border-top: 1px solid var(--line); }
      textarea, .output { min-height: 230px; }
    }
    __STYLE_CSS__
  </style>
</head>
<body data-webapp-kind="__KIND__" data-deliverable-type="__DELIVERABLE__" data-style="__STYLE_ID__" data-ai-capabilities="__AI_CAPABILITIES__">
  <main>
    <header>
      <div>
        <h1>__TITLE__</h1>
        <p class="summary">__SUMMARY__</p>
      </div>
    </header>
    <section class="workspace" aria-label="工作区">
      <div class="panel" data-tool-input>
        <div class="panel-head"><h2>输入</h2><span id="count">0 字符</span></div>
        <label for="source">待处理内容</label>
        <textarea id="source" placeholder="每行输入一项；示例数据可用于验证清洗规则"></textarea>
        <div class="actions">
          <button class="primary" id="runButton" data-primary-action type="button">清洗名单</button>
          <button id="exampleButton" data-example-input type="button">载入示例</button>
          <button id="clearButton" data-reset-state type="button">清空</button>
        </div>
      </div>
      <div class="panel" data-tool-output>
        <div class="panel-head"><h2>结果</h2></div>
        <pre class="output" id="output" aria-live="polite">等待输入。</pre>
        <div class="actions">
          <button id="copyButton" type="button" disabled>复制结果</button>
          <button id="downloadButton" type="button" disabled>下载文本</button>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script>
    const source = document.querySelector('#source');
    const output = document.querySelector('#output');
    const count = document.querySelector('#count');
    const status = document.querySelector('#status');
    const copyButton = document.querySelector('#copyButton');
    const downloadButton = document.querySelector('#downloadButton');

    function transform(value) {
      const normalized = value.replace(/\r\n/g, '\n').split('\n').map(line => line.trim()).filter(Boolean);
      return [...new Set(normalized)].join('\n');
    }

    function setResult(value) {
      output.textContent = value || '没有可输出的内容。';
      copyButton.disabled = !value;
      downloadButton.disabled = !value;
    }

    source.addEventListener('input', () => {
      count.textContent = `${source.value.length} 字符`;
      status.textContent = '';
    });
    document.querySelector('#runButton').addEventListener('click', () => {
      const before = source.value.replace(/\r\n/g, '\n').split('\n').filter(line => line.trim()).length;
      const value = transform(source.value);
      setResult(value);
      const after = value ? value.split('\n').length : 0;
      status.textContent = value ? `清洗完成：保留 ${after} 项，移除 ${Math.max(0, before - after)} 个重复或空项。` : '请先输入至少一项内容。';
      if (!value) source.focus();
    });
    document.querySelector('#exampleButton').addEventListener('click', () => {
      source.value = '河岸书店\n 北门咖啡 \n河岸书店\n\n城市博物馆';
      count.textContent = `${source.value.length} 字符`;
      setResult('');
      status.textContent = '示例已载入，点击“清洗名单”查看去重结果。';
      source.focus();
    });
    document.querySelector('#clearButton').addEventListener('click', () => {
      source.value = '';
      count.textContent = '0 字符';
      setResult('');
      status.textContent = '已清空。';
      source.focus();
    });
    copyButton.addEventListener('click', async () => {
      await navigator.clipboard.writeText(output.textContent);
      status.textContent = '已复制。';
    });
    downloadButton.addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([output.textContent], { type: 'text/plain;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'result.txt';
      link.click();
      URL.revokeObjectURL(url);
      status.textContent = '下载已开始。';
    });
  </script>
</body>
</html>
