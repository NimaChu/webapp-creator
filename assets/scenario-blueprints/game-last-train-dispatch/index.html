<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root{--bg:#171330;--surface:#28204C;--text:#FFF5D6;--muted:#AAA0CF;--accent:#FF4FA3;--secondary:#4DE6C1;--line:#6D5AAE;--danger:#FF7B6E;--display-font:"Courier New",ui-monospace,monospace;--body-font:Arial,"PingFang SC",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--text);background:radial-gradient(circle at 30% 0,#342B62 0,transparent 32%),var(--bg);font-family:var(--body-font)}main{width:min(1020px,calc(100% - 28px));margin:auto;padding:26px 0 44px}.topline{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.eyebrow{margin:0 0 8px;color:var(--secondary);font:700 .78rem var(--display-font);letter-spacing:.12em}.topline h1{margin:0;font:clamp(2.2rem,6vw,5rem)/.86 var(--display-font);letter-spacing:-.08em}.summary{max-width:54ch;margin:13px 0 0;color:var(--muted);line-height:1.55}.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;min-width:310px;background:var(--line);border:2px solid var(--line)}.scoreboard div{padding:12px;background:var(--surface);text-align:center}.scoreboard span{display:block;color:var(--muted);font:.68rem var(--display-font);letter-spacing:.08em}.scoreboard strong{display:block;margin-top:4px;font:1.45rem var(--display-font)}.game{overflow:hidden;border:3px solid var(--text);background:#0D0A1C;box-shadow:9px 9px 0 #090613}.line{height:10px;background:repeating-linear-gradient(90deg,var(--accent) 0 36px,transparent 36px 52px)}.board{display:grid;grid-template-columns:1.1fr .9fr;min-height:510px}.signal-room{position:relative;padding:32px;border-right:2px solid var(--line);background:linear-gradient(135deg,#18132C,#211A42)}.station{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 48%,rgb(255 245 214/.08) 48% 52%,transparent 52%),repeating-linear-gradient(0deg,transparent 0 64px,rgb(255 245 214/.035) 64px 66px)}.mission{position:relative;max-width:480px;padding:22px;background:var(--surface);border:2px solid var(--line);box-shadow:6px 6px 0 #0D0A1C}.mission h2{margin:0 0 11px;font:1.65rem var(--display-font)}.mission p{margin:0;color:var(--muted);line-height:1.55}.ticket{position:relative;margin-top:24px;padding:22px;border:2px dashed var(--secondary);background:#100D23}.ticket small{display:block;color:var(--secondary);font:.72rem var(--display-font);letter-spacing:.1em}.ticket strong{display:block;margin:9px 0 3px;font:clamp(1.45rem,4vw,2.5rem) var(--display-font)}.ticket span{color:var(--muted)}.train{position:absolute;right:0;bottom:48px;width:min(88%,460px);height:96px;padding:16px 18px;background:var(--accent);border:3px solid var(--text);box-shadow:7px 7px 0 #090613;transition:transform .45s ease}.train.is-departing{transform:translateX(120%)}.train b{display:block;color:#23031A;font:1.05rem var(--display-font)}.windows{display:flex;gap:8px;margin-top:12px}.windows i{display:block;width:26px;height:25px;background:#FFF5D6;border:2px solid #23031A}.console{padding:30px;background:#100D23}.console h2{margin:0;font:1.7rem var(--display-font)}.objective{margin:13px 0 22px;padding:15px;border-left:5px solid var(--secondary);background:rgb(77 230 193/.1);color:var(--muted);line-height:1.55}.signals{display:grid;gap:10px}.signal{display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center;width:100%;min-height:76px;padding:12px 14px;color:var(--text);border:2px solid var(--line);background:var(--surface);font:inherit;text-align:left;cursor:pointer}.signal:hover{border-color:var(--secondary);transform:translateX(3px)}.signal:disabled{opacity:.52;cursor:not-allowed;transform:none}.signal:focus-visible,.restart:focus-visible{outline:3px solid var(--secondary);outline-offset:4px}.lamp{width:34px;aspect-ratio:1;border:3px solid var(--text);border-radius:50%;background:var(--accent)}.signal:nth-child(2) .lamp{background:var(--secondary)}.signal:nth-child(3) .lamp{background:#7E8BFF}.signal b{font:1rem var(--display-font)}.signal small{color:var(--muted)}.key{padding:5px 8px;border:1px solid var(--line);font:.72rem var(--display-font)}.status{min-height:50px;margin:22px 0 14px;padding:13px;background:#0A0816;border:1px solid var(--line);color:var(--muted);line-height:1.45}.status.good{color:var(--secondary)}.status.bad{color:var(--danger)}.restart{min-height:43px;padding:0 15px;color:#160514;border:2px solid var(--secondary);background:var(--secondary);font:800 1rem var(--body-font);cursor:pointer}.footer-note{margin:12px 0 0;color:var(--muted);font-size:.78rem;line-height:1.45}@media(max-width:760px){main{width:min(100% - 18px,700px);padding-top:14px}.topline{align-items:start;flex-direction:column}.scoreboard{width:100%;min-width:0}.board{grid-template-columns:1fr}.signal-room{min-height:420px;border-right:0;border-bottom:2px solid var(--line)}.console{padding:22px}.train{bottom:30px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}
    __STYLE_CSS__
  </style>
</head>
<body data-webapp-kind="__KIND__" data-deliverable-type="__DELIVERABLE__" data-style="__STYLE_ID__" data-scenario="__SCENARIO__" data-ai-capabilities="__AI_CAPABILITIES__">
  <main>
    <header class="topline"><div><p class="eyebrow">PIXEL RAIL / FINAL SERVICE</p><h1>__TITLE__</h1><p class="summary">__SUMMARY__</p></div><div class="scoreboard" aria-label="调度进度"><div><span>正确</span><strong id="score">0/12</strong></div><div><span>失误</span><strong id="mistakes">0/3</strong></div><div><span>最佳</span><strong id="best">0</strong></div></div></header>
    <section class="game" data-game-state aria-label="末班车调度游戏"><div class="line"></div><div class="board"><section class="signal-room"><div class="station" aria-hidden="true"></div><div class="mission"><h2>站台请求</h2><p>读出乘客的方向牌，把下一班末班车接入正确信号台。错误三次，列车将错过夜间窗口。</p><div class="ticket" aria-live="polite"><small>NEXT PASSENGER / DESTINATION</small><strong id="request">按“开始调度”</strong><span id="route">信号台等待指令</span></div></div><div class="train" id="train" aria-hidden="true"><b>LAST TRAIN · 23:48</b><div class="windows"><i></i><i></i><i></i><i></i><i></i></div></div></section><aside class="console"><h2>信号台</h2><p class="objective" data-game-objective>目标：完成 <strong>12 次正确调度</strong>，让末班车带走每一位等待的乘客。</p><div class="signals" id="signals"><button class="signal" type="button" data-platform="月台 A" disabled><span class="lamp"></span><span><b>月台 A</b><small>滨江方向</small></span><span class="key">1</span></button><button class="signal" type="button" data-platform="月台 B" disabled><span class="lamp"></span><span><b>月台 B</b><small>旧城方向</small></span><span class="key">2</span></button><button class="signal" type="button" data-platform="月台 C" disabled><span class="lamp"></span><span><b>月台 C</b><small>北站方向</small></span><span class="key">3</span></button></div><p class="status" id="status" role="status" aria-live="polite">按“开始调度”开启本轮。</p><button class="restart" id="restart" data-game-restart type="button">开始调度</button><p class="footer-note">键盘可按 <b>1</b>、<b>2</b>、<b>3</b> 切换信号。本地仅保存最高连续正确次数。</p></aside></div></section>
  </main>
  <script>
    const orders=[['月台 A','滨江方向 · 河畔剧场'],['月台 B','旧城方向 · 北门书店'],['月台 C','北站方向 · 凌晨换乘'],['月台 B','旧城方向 · 石库门路口'],['月台 A','滨江方向 · 灯塔码头'],['月台 C','北站方向 · 夜班候车室']];
    const scoreNode=document.querySelector('#score'),mistakeNode=document.querySelector('#mistakes'),bestNode=document.querySelector('#best'),requestNode=document.querySelector('#request'),routeNode=document.querySelector('#route'),statusNode=document.querySelector('#status'),restart=document.querySelector('#restart'),train=document.querySelector('#train'),buttons=[...document.querySelectorAll('[data-platform]')];
    const storageKey='last-train-dispatch-best';let best=Number(localStorage.getItem(storageKey)||0),score=0,mistakes=0,turn=0,active=false,current;
    bestNode.textContent=best;
    function setControls(enabled){buttons.forEach(button=>button.disabled=!enabled)}
    function next(){if(score>=12){finish(true);return}current=orders[turn%orders.length];turn+=1;requestNode.textContent=current[1];routeNode.textContent='请将列车接入对应月台';statusNode.className='status';statusNode.textContent='等待信号：选择与目的地方向相符的月台。';active=true;setControls(true)}
    function finish(won){active=false;setControls(false);best=Math.max(best,score);localStorage.setItem(storageKey,String(best));bestNode.textContent=best;requestNode.textContent=won?'夜行任务完成':'末班窗口关闭';routeNode.textContent=won?'12 位乘客均已登车':'失误达到上限，下一班请更稳一些';statusNode.className=`status ${won?'good':'bad'}`;statusNode.textContent=won?`成功调度 ${score} 次。列车准点离站。`:`本轮正确 ${score} 次，出现 ${mistakes} 次错轨。`;restart.textContent='再调度一轮'}
    function dispatch(platform){if(!active)return;setControls(false);const correct=platform===current[0];if(correct){score+=1;scoreNode.textContent=`${score}/12`;statusNode.className='status good';statusNode.textContent=`信号接通：${platform} 已放行。`;train.classList.add('is-departing');setTimeout(()=>{train.classList.remove('is-departing');next()},460)}else{mistakes+=1;mistakeNode.textContent=`${mistakes}/3`;statusNode.className='status bad';statusNode.textContent=`错轨警报：请求的是 ${current[0]}。`;setTimeout(()=>mistakes>=3?finish(false):next(),650)}}
    function start(){score=0;mistakes=0;turn=0;scoreNode.textContent='0/12';mistakeNode.textContent='0/3';restart.textContent='重新开始';next()}
    buttons.forEach(button=>button.addEventListener('click',()=>dispatch(button.dataset.platform)));restart.addEventListener('click',start);window.addEventListener('keydown',event=>{if(!active)return;const key=Number(event.key);if(key>=1&&key<=3){event.preventDefault();dispatch(buttons[key-1].dataset.platform)}});
  </script>
</body>
</html>
