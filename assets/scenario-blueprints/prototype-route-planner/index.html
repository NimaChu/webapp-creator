<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>__TITLE__</title>
<style>
:root{--bg:#DCD5C7;--surface:#FFF9EA;--text:#292721;--muted:#70695D;--accent:#1B6B5A;--secondary:#E5B94A;--line:#B8AE9E;--display-font:Georgia,serif;--body-font:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body-font)}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:30px 0 50px}.masthead{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{margin:0 0 8px;color:var(--accent);font-weight:800;letter-spacing:.1em}.summary{max-width:52ch;line-height:1.6;color:var(--muted)}h1{margin:0;font:clamp(2.4rem,6vw,5rem)/.95 var(--display-font)}.hypothesis{max-width:330px;padding:12px;border:1px dashed var(--accent);font-size:.86rem;line-height:1.45;transform:rotate(1deg)}.board{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;margin-top:24px}.panel{padding:22px;background:var(--surface);border:1px solid var(--line);box-shadow:4px 5px 0 rgb(41 39 33 / .12)}h2{margin:0 0 15px;font:1.55rem var(--display-font)}.field{display:grid;gap:7px;margin:15px 0}.field label{font-weight:700}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{padding:10px 12px;border:1px solid var(--line);cursor:pointer}.choice:has(input:checked){color:white;background:var(--accent);border-color:var(--accent)}button{min-height:42px;padding:0 15px;color:var(--text);background:var(--surface);border:1px solid var(--text);font:inherit;cursor:pointer}button.primary{color:white;background:var(--accent)}button:focus-visible,input:focus-visible{outline:3px solid var(--secondary);outline-offset:2px}.route{position:relative;min-height:290px;padding:18px;overflow:hidden;background:linear-gradient(135deg,#F7F0DC,#D6E0C4);border:1px solid var(--line)}.route svg{position:absolute;inset:0;width:100%;height:100%}.stop{position:absolute;padding:6px 9px;background:var(--surface);border:1px solid var(--text);font-size:.78rem}.stop.a{left:8%;bottom:16%}.stop.b{left:39%;top:18%}.stop.c{right:12%;bottom:20%}.explain{display:grid;gap:10px;margin-top:14px}.note{padding:12px;border-left:5px solid var(--secondary);background:#FFF4C9;line-height:1.5}.route-summary{margin:0;padding:16px;background:var(--text);color:var(--surface);line-height:1.55}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.status{min-height:1.4em;color:var(--accent);font-weight:700}@media(max-width:720px){.masthead{align-items:start;flex-direction:column}.board{grid-template-columns:1fr}.hypothesis{max-width:none}}
__STYLE_CSS__</style></head>
<body data-webapp-kind="__KIND__" data-deliverable-type="__DELIVERABLE__" data-style="__STYLE_ID__" data-scenario="__SCENARIO__" data-ai-capabilities="__AI_CAPABILITIES__"><main>
<header class="masthead"><div><p class="eyebrow">可测试原型 · ROUTE 01</p><h1>__TITLE__</h1><p class="summary">__SUMMARY__</p></div><aside class="hypothesis" data-prototype-hypothesis><strong>测试假设</strong><br>用户看见路线的取舍理由后，会更愿意接受非最短但更舒适的夜行方案。</aside></header>
<section class="board"><form class="panel" id="planner"><h2>1. 写下约束</h2><div class="field"><label for="start">从哪里出发？</label><input id="start" value="城市博物馆" maxlength="60"></div><div class="field"><label for="goal">今晚想要什么？</label><input id="goal" value="安静、安全、可停留" maxlength="80"></div><fieldset class="field"><legend>更看重</legend><div class="choices"><label class="choice"><input type="radio" name="priority" value="照明与人流" aria-label="更看重照明与人流" checked>照明与人流</label><label class="choice"><input type="radio" name="priority" value="步行更短" aria-label="更看重步行更短">步行更短</label><label class="choice"><input type="radio" name="priority" value="可停留空间" aria-label="更看重可停留空间">可停留空间</label></div></fieldset><div class="actions"><button class="primary" type="submit">更新路线</button><button id="reset" type="button">重置</button></div><p class="status" id="status" aria-live="polite"></p></form>
<section class="panel" data-decision><h2>2. 看见取舍</h2><div class="route" aria-label="从博物馆到河岸书店的示意路线"><svg viewBox="0 0 600 320" aria-hidden="true"><path d="M75 250 C180 220 210 95 310 110 S420 260 520 205" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/><path d="M75 250 C220 260 350 285 520 205" fill="none" stroke="var(--line)" stroke-width="8" stroke-dasharray="12 12"/></svg><span class="stop a">博物馆</span><span class="stop b">有照明的街角</span><span class="stop c">河岸书店</span></div><div class="explain"><div class="note" id="reason">推荐路径绕开施工路段，多走 6 分钟，换来连续照明、两处可停留点和更少横穿路口。</div><p class="route-summary" id="route-summary">推荐路线：步行 1.4 km · 约 22 分钟 · 3 个可解释节点</p></div><div class="actions"><button id="copy" type="button">复制路线</button></div></section></section>
</main><script>const planner=document.querySelector('#planner'),reason=document.querySelector('#reason'),summary=document.querySelector('#route-summary'),status=document.querySelector('#status');function plan(){const p=document.querySelector('[name="priority"]:checked').value;const copy={"照明与人流":"推荐路径绕开施工路段，多走 6 分钟，换来连续照明、两处可停留点和更少横穿路口。","步行更短":"推荐直线路径，减少约 350 米步行距离，但有一段照明较弱，需要在路口更谨慎通过。","可停留空间":"推荐河岸支线，增加一个开放较晚的书店停留点，适合把路线变成可调整的夜间计划。"}[p];reason.textContent=copy;summary.textContent=`从 ${document.querySelector('#start').value||'出发点'} 出发：${p}优先 · 方案为示意原型，不代表实时导航`;status.textContent='路线已按你的优先级更新。'}planner.addEventListener('submit',e=>{e.preventDefault();plan()});document.querySelector('#reset').addEventListener('click',()=>{planner.reset();plan();status.textContent='已恢复原始假设。'});document.querySelector('#copy').addEventListener('click',async()=>{await navigator.clipboard.writeText(summary.textContent);status.textContent='路线摘要已复制。'});plan();</script></body></html>
